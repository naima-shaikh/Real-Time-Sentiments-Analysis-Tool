# Use a slim Python image as the base
FROM python:3.10-slim

# Set the working directory
WORKDIR /app

# Copy the requirements file and install dependencies
COPY requirements.txt requirements.txt
RUN pip install --no-cache-dir -r requirements.txt

# Copy the rest of the application code
COPY . .

# Expose the port your application listens on (e.g., 8080 is common for Cloud Run)
EXPOSE 8080

# Command to run the application using Gunicorn, a production web server
# Replace 'app:app' with the appropriate entry point for your main file
CMD exec gunicorn --bind :$PORT --workers 1 --threads 8 app:app
